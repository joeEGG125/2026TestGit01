server.port=8218

spring.fep.application.name=fep-server

management.endpoints.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.fep.application.name}-bizloan
management.endpoint.health.show-details=always

spring.register.bean[0]=com.syscom.fep.server.queue.BizloanServerReceiver


#BIZLOAN MAP Queue

spring.fep.jms.bizloan.prop[0].queueManager=QMFEPP02
spring.fep.jms.bizloan.prop[0].channel=SVRCONN.FEPAP
spring.fep.jms.bizloan.prop[0].connName=10.0.54.34(1414)
spring.fep.jms.bizloan.prop[0].user=
spring.fep.jms.bizloan.prop[0].password=

spring.datasource.fepdb.hikari.maximum-pool-size=30
spring.datasource.desdb.hikari.maximum-pool-size=30