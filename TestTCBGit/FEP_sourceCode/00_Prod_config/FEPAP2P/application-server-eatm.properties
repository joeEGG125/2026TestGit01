server.port=8203

spring.fep.application.name=fep-server

management.endpoints.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.fep.application.name}-eatm
management.endpoint.health.show-details=always

spring.register.bean[0]=com.syscom.fep.server.queue.EATMServerReceiver


#EATM MAP Queue

spring.fep.jms.eatm.prop[0].queueManager=QMFEPP02
spring.fep.jms.eatm.prop[0].channel=SVRCONN.FEPAP
spring.fep.jms.eatm.prop[0].connName=10.0.54.34(1414)
spring.fep.jms.eatm.prop[0].user=
spring.fep.jms.eatm.prop[0].password=
