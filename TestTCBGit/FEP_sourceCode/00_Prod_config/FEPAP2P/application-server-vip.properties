server.port=8216

spring.fep.application.name=fep-server

management.endpoints.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.fep.application.name}-vip
management.endpoint.health.show-details=always

spring.register.bean[0]=com.syscom.fep.server.queue.VIPServerReceiver


#VIP MAP Queue
#spring.fep.jms.vip.debug=-1
spring.fep.jms.vip.prop[0].queueManager=QMFEPP02
spring.fep.jms.vip.prop[0].channel=SVRCONN.FEPAP
spring.fep.jms.vip.prop[0].connName=10.0.54.34(1414)
spring.fep.jms.vip.prop[0].user=
spring.fep.jms.vip.prop[0].password=

spring.datasource.fepdb.hikari.maximum-pool-size=150
spring.datasource.desdb.hikari.maximum-pool-size=150