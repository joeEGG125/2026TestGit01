server.port=8084

spring.fep.application.name=fep-batch

management.endpoints.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.fep.application.name}
management.endpoint.health.show-details=always

# logging.config=classpath:logback-spring.xml

spring.fep.batch.subsys=1;2;3;4;5;6;7;8;9
spring.fep.batch.mailsender=fep@tcb-bank.com.tw
spring.fep.batch.maillist=AP1_FEP@tcb-bank.com.tw
spring.fep.batch.updateNextRunTimeInitialDelayMilliseconds=30000
spring.fep.batch.updateNextRunTimeIntervalMilliseconds=60000

spring.fep.batch.checkAndNotifyAllMisfiredInitialDelaySeconds=1800
spring.fep.batch.checkAndNotifyAllMisfiredIntervalSeconds=1800
spring.fep.batch.checkAndNotifyAllMisfiredToleranceSeconds=60


spring.fep.batch.execute.shell.path=/fep/fep-app/fep-batch-cmdline/fep_batch_cmdline_run.sh
spring.fep.batch.resultFilePath=/fep/batchResult.log

# enable mail
spring.fep.mail.enable=true

# enable mitake sms
spring.fep.sms.mitake.enable=true