<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{home}">
<head>
	<meta charset="UTF-8"></meta>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>
<body>
<div layout:fragment="panel-condition">
	<form id="form-validator" th:object="${form}" th:action="@{/batch/UI_000100_C/confirmClick}" method="post">
		<table border="0" cellspacing="0" class="table-condition">
			<tr>
				<td class="condition-label">
					<label for="sourceHost" class="col-form-label">來源主機：</label>
				</td>
				<td class="condition-input">
					<select id="sourceHost" th:field="*{sourceHost}" class="form-control">
						<option th:each="option : ${options}" th:text="${option.text}" th:value="${option.value}"/>
					</select>
				</td>
			</tr>
			<tr>
				<td class="condition-label">
					<label for="targetHost" class="col-form-label">執行主機：</label>
				</td>
				<td class="condition-input">
					<select id="targetHost" th:field="*{targetHost}" class="form-control">
						<option th:each="option : ${options}" th:text="${option.text}" th:value="${option.value}"/>
					</select>
				</td>
			</tr>
		</table>
	</form>
</div>
<div layout:fragment="panel-button">
	<button type="button" class="btn btn-primary" id="btnComit">確認</button>
	<button type="button" class="btn btn-primary" id="btnPrevPage">取消</button>
</div>
<div layout:fragment="panel-summary" class="panel-hidden"></div>
<div layout:fragment="panel-script">
	<script type="text/javascript" th:src="@{/js/batch/UI000100C.js}"></script>
</div>
</body>
</html>
