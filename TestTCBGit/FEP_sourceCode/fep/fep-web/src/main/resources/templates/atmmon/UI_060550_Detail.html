<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{home}">
<head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>
<body>
<div layout:fragment="panel-condition" class="panel-hidden">
    <form id="form-validator" th:action="@{/atmmon/UI_060550/inquiryFeplogList}" method="post" th:if="${detailMap!=null}">
        <input type="hidden" name="feptxnEjfno" th:value="${detailMap.get('FEPTXN_EJFNO')}">
        <input type="hidden" name="feptxnTraceEjfno" th:value="${detailMap.get('FEPTXN_TRACE_EJFNO')}">
        <input type="hidden" name="feptxnPcode" th:value="${detailMap.get('FEPTXN_PCODE')}">
        <input type="hidden" name="feptxnMsgid" th:value="${detailMap.get('FEPTXN_MSGID')}">
        <input type="hidden" name="feptxnTxDate" th:value="${detailMap.get('FEPTXN_TX_DATE')}">
        <input type="hidden" name="feptxnSubsys" th:value="${detailMap.get('FEPTXN_SUBSYS')}">
    </form>
    <form id="form-validator1" th:action="@{/atmmon/UI_060550/ucdidHistory}" method="post" th:if="${detailMap!=null}">
        <input type="hidden" name="ucdidIdno" th:value="${detailMap.get('UCDID_IDNO')}">
        <input type="hidden" name="ucdidHealthid" th:value="${detailMap.get('UCDID_HEALTHID')}">
    </form>
</div>
<div layout:fragment="panel-button">
    <button type="button" class="btn btn-primary" id="btnQuery" form="form-validator" th:if="${detailMap!=null}">查詢</button>
    <button type="button" class="btn btn-primary" id="btnPrevPage">上一頁</button>
</div>
<div layout:fragment="panel-summary" class="panel-hidden"></div>
<div layout:fragment="panel-grid" class="panel-detail">
    <div class="card card-primary card-outline card-tabs">
        <div class="card-header p-0 pt-1 border-bottom-0">
			<ul class="nav nav-tabs" role="tablist">
				<li fep:nav-item="tabId1" nav-item-selected="true" nav-item-caption="基本資料"></li>
				<li th:if="${detailMap!=null && detailMap.get('FEPTXN_CBS_PROC') eq 'N'}" fep:nav-item="tabId2" nav-item-selected="false" nav-item-caption="TCB交易資料"></li>
				<li th:if="${detailMap!=null && detailMap.get('FEPTXN_CBS_PROC') eq 'N' && (detailMap.get('FEPTXN_PCODE') eq '2505' || detailMap.get('FEPTXN_PCODE') eq '2571' || detailMap.get('FEPTXN_PCODE') eq '2572' || detailMap.get('FEPTXN_PCODE') eq '2545' || detailMap.get('FEPTXN_PCODE') eq '2546' )}" fep:nav-item="tabId3"
					nav-item-selected="false" nav-item-caption="晶片卡跨國"></li>
				<li th:if="${form.inbk2160!=null && detailMap!=null && detailMap.get('FEPTXN_CBS_PROC') eq 'N'}" fep:nav-item="tabId4" nav-item-selected="false" nav-item-caption="2160"></li>
				<li th:if="${detailMap!=null && detailMap.get('FEPTXN_CBS_PROC') eq 'N' && (detailMap.get('FEPTXN_PCODE') eq '2566')}" fep:nav-item="tabId5" nav-item-selected="false" nav-item-caption="約定及核驗"></li>
				<li th:if="${detailMap!=null && detailMap.get('FEPTXN_CBS_PROC') eq 'N' && (detailMap.get('FEPTXN_PCODE') != null && detailMap.get('FEPTXN_PCODE') != '' && (detailMap.get('FEPTXN_PCODE').substring(0,2) eq '26' || detailMap.get('FEPTXN_PCODE').substring(0,2) eq '24'))}" fep:nav-item="tabId6" nav-item-selected="false" nav-item-caption="國際卡"></li>
                <li th:if="${detailMap!=null
                    and detailMap.get('FEPTXN_PCODE')!=null
                    and detailMap.get('FEPTXN_CBS_PROC') == 'N'
                    and ((#strings.startsWith(detailMap.get('FEPTXN_PCODE'), '253'))
                    or (#strings.startsWith(detailMap.get('FEPTXN_PCODE'), '256'))
                    or (#strings.startsWith(detailMap.get('FEPTXN_PCODE'), '226')))
                    and detailMap.get('FEPTXN_PCODE') != '2566'}"
                    fep:nav-item="tabId7" nav-item-selected="false" nav-item-caption="繳費稅">
                </li>
                <li th:if="${detailMap != null and detailMap.get('FEPTXN_TX_CODE') != null
                    and ((#strings.startsWith(detailMap.get('FEPTXN_TX_CODE'), 'LF')
                    and form.feptxntcb != null and form.feptxntcb.feptxntcbFacode == 'TT')
                    or #strings.startsWith(detailMap.get('FEPTXN_TX_CODE'), 'WP')
                    )}"
                    fep:nav-item="tabId8" nav-item-selected="false" nav-item-caption="普發紀錄">
                </li>
            </ul>
        </div>
