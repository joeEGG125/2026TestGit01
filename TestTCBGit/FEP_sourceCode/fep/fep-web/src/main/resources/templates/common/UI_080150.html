<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" layout:decorate="~{home}">

<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>
<body>
	<div layout:fragment="panel-condition">
		<form id="form-upload" method="POST" th:action="@{/common/UI_080150/upload}" enctype="multipart/form-data">
			<table border="0" cellspacing="0" class="table-condition">
				<tr>
					<td class="condition-label" style="width:150px">
						<label for="transactDate" class="col-form-label"><font color="red">*</font>選擇基碼檔</label>
					</td>
					<td class="condition-input">
                        <input id="kmsFile" type="file" name="file"/> (遇空白行結束)
					</td>
				</tr>
			</table>
		</form>
		<br><br>
	</div>
	<div layout:fragment="panel-button">
		<form>
			<table border="0" cellspacing="0" class="table-condition">
				<tr>
					<td>
		    			<button style="width:100px" type="button" class="btn btn-primary" id="btnUpload">確認</button>
		    		</td>
		    	</tr>
		    </table>
		</form>
	</div>
	<div layout:fragment="panel-summary" class="panel-hidden"></div>
	<div layout:fragment="panel-grid" th:if="${form.resultMessage != null}">
		<div class="card-body table-responsive p-0">
			<table class="table table-striped table-bordered table-head-fixed text-nowrap">
				<tr>
					<td>
						<label class="form-control" style="height:auto;" th:utext="${form.resultMessage}"></label>
					<td>
				</tr>
			</table>
		</div>
	</div>
	<div layout:fragment="panel-script">
		<script type="text/javascript" th:src="@{/js/common/UI080150.js}"></script>
	</div>
</body>

</html>
