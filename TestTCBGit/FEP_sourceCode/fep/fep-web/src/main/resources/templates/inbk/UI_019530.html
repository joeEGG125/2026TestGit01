<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{home}">
<head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>
<body>
<div layout:fragment="panel-condition">
    <form id="form-validator" th:object="${form}" th:action="@{/inbk/UI_019530/queryClick}" method="post">
        <input type="hidden" id="processActionUrl" th:value="@{/inbk/UI_019530/processAction}" />
        <table border="0" cellspacing="0" class="table-condition">
            <tr>
                <td class="condition-label">
                    <label for="feptxnTbsdyFisc" class="col-form-label">營業日</label>
                </td>
                <td class="condition-input">
                    <div class="input-group date" id="feptxnTbsdyFisc" data-target-input="nearest">
                        <input type="text" class="form-control datetimepicker-input" data-target="#feptxnTbsdyFisc"
                               th:field="*{feptxnTbsdyFisc}"/>
                        <div class="input-group-append" data-target="#feptxnTbsdyFisc" data-toggle="datetimepicker">
                            <div class="input-group-text">
                                <i class="fa fa-calendar"></i>
                            </div>
                        </div>
                    </div>
                </td>
                <td class="condition-label">
                    <label for="transSelect" class="col-form-label">交易</label>
                </td>
                <td class="condition-input">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="transAR" value="transAR" th:field="*{transSelect}">
                        <label class="form-check-label" for="transAR">收款</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="transAP" value="transAP" th:field="*{transSelect}">
                        <label class="form-check-label" for="transAP">付款</label>
                    </div>
                </td>
            </tr>
        </table>
    </form>
</div>
<div layout:fragment="panel-button">
    <button type="button" class="btn btn-primary" id="btnQuery">查詢</button>
    <button type="button" class="btn btn-primary" id="btnClear">清除</button>
</div>
<div layout:fragment="panel-summary" class="panel-hidden"></div>
<div layout:fragment="panel-grid">
    <div class="card-body table-responsive p-0">
        <table class="table table-striped table-bordered table-head-fixed table-hover text-nowrap"
               th:if="${pageData != null}">
            <thead>
            <tr>
                <th style="text-align: center;"><b>執行動作</b></th>
                <th><b>交易時間</b></th>
                <th><b>營業日</b></th>
                <th><b>交易序號</b></th>
                <th><b>付款人</b></th>
                <th><b>收款人</b></th>
                <th><b>交易金額</b></th>
                <th><b>扣款帳號</b></th>
                <th><b>轉入帳號</b></th>
                <th><b>入帳帳號</b></th>
                <th><b>主機回應代碼</b></th>
                <th><b>財金回應代碼</b></th>
                <th><b>附言欄</b></th>
            </tr>
            </thead>
            <tbody th:if="${pageData.list != null}">
            <tr th:each="data : ${pageData.list}">
                <td align="center">
                    <th:block th:if="${form.transSelect == 'transAR'}">
                        <button type="button" class="btn btn-success btn-sm action-btn" data-action="successIn" th:attr="data-seq=${data.UI_TX_SEQ}, data-time=${data.UI_TX_TIME}" th:style="${form.hasFepEbmk and form.before1650} ? null : 'display:none'">成功入帳</button>
                        <button type="button" class="btn btn-danger btn-sm action-btn" data-action="failIn" th:attr="data-seq=${data.UI_TX_SEQ}, data-time=${data.UI_TX_TIME}" th:style="${form.hasFepEbmk} ? null : 'display:none'">交易失敗</button>
                        <button type="button" class="btn btn-warning btn-sm action-btn" data-action="reviewIn" th:attr="data-seq=${data.UI_TX_SEQ}, data-time=${data.UI_TX_TIME}" th:style="${form.hasFepEbck} ? null : 'display:none'">覆核</button>
                    </th:block>

                    <th:block th:if="${form.transSelect == 'transAP'}">
                        <button type="button" class="btn btn-success btn-sm action-btn" data-action="successOut" th:attr="data-seq=${data.UI_TX_SEQ}, data-time=${data.UI_TX_TIME}" th:style="${form.hasFepEbmk and form.before1650} ? null : 'display:none'">成功扣帳</button>
                        <button type="button" class="btn btn-danger btn-sm action-btn" data-action="failOut" th:attr="data-seq=${data.UI_TX_SEQ}, data-time=${data.UI_TX_TIME}" th:style="${form.hasFepEbmk} ? null : 'display:none'">交易失敗</button>
                        <button type="button" class="btn btn-warning btn-sm action-btn" data-action="reviewOut" th:attr="data-seq=${data.UI_TX_SEQ}, data-time=${data.UI_TX_TIME}" th:style="${form.hasFepEbck} ? null : 'display:none'">覆核</button>
                    </th:block>
                </td>
                <td align="center" th:text="${data.UI_TX_TIME}"></td>
                <td align="center" th:text="${data.UI_TBSDY_FISC}"></td>
                <td align="center" th:text="${data.UI_TX_SEQ}"></td>
                <td align="center" th:text="${data.UI_FROM_NAME}"></td>
                <td align="center" th:text="${data.UI_TO_NAME}"></td>
                <td align="center" th:text="${data.UI_TX_AMT}"></td>
                <td align="center" th:text="${data.UI_TROUT_ACTNO}"></td>
                <td align="center" th:text="${data.UI_TRIN_ACTNO}"></td>
                <td align="center" th:text="${data.UI_TRIN_ACTNO_ACTUAL}"></td>
                <td align="center" th:text="${data.UI_CBS_RC}"></td>
                <td align="center" th:text="${data.UI_CON_RC}"></td>
                <td align="center" th:text="${data.UI_FXML_MEMO}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div layout:fragment="panel-script">
    <script type="text/javascript" th:src="@{/js/inbk/UI019530.js}"></script>
</div>

</body>
</html>
