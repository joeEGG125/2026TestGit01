<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
	layout:decorate="~{home}">

<head>
	<meta charset="UTF-8">
	</meta>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
</head>

<body>	
	<div layout:fragment="panel-condition">
		<form id="form-validator" th:object="${form}" th:action="@{/atmmon/UI_060630/bindGrid}" method="post">
			<table border="0" cellspacing="0" class="table-condition">
				<tr>
					<td class="condition-label" style="width:200px">
						<label class="col-form-label">來源通道:</label>
					</td>
					<td class="condition-input" style="width:200px">
						<select id="channel" class="form-control" th:field="*{channel}">
							<option th:each="option : ${options}" th:text="${option.text}" th:value="${option.value}" th:selected="${option.value == channel}" />
						</select>
					</td>
					<td style="width:50px"></td>
					<td class="condition-label" style="width:200px">
						<label class="col-form-label">訊息代碼:</label>
					</td>
					<td class="condition-input" style="width:200px">
						<input id="errorCode" style="width:150px" type="text" class="form-control" th:field="*{errorCode}" th:maxlength="5"/>
					</td>
				</tr>
				<tr>
					<td class="condition-label">
						<label class="col-form-label">財金訊息代碼:</label>
					</td>
					<td class="condition-input">
						<input id="msgfileFisc" style="width:150px" type="text" class="form-control" th:field="*{msgfileFisc}" th:maxlength="5"/>
					</td>
					<td></td>
					<td class="condition-label">
						<label class="col-form-label">ATM訊息代碼:</label>
					</td>
					<td class="condition-input">
						<input id="msgfileAtm" style="width:150px" type="text" class="form-control" th:field="*{msgfileAtm}" th:maxlength="5"/>
					</td>
				</tr>
				<tr>
					<td class="condition-label">
						<label class="col-form-label">CBS主機訊息代碼:</label>
					</td>
					<td class="condition-input">
						<input id="msgfileT24" style="width:150px" type="text" class="form-control" th:field="*{msgfileT24}" />
					</td>
					<td></td>
					<td class="condition-label">
						<label class="col-form-label">信用卡訊息代號:</label>
					</td>
					<td class="condition-input">
						<input id="msgfileCredit" style="width:150px" type="text" class="form-control" th:field="*{msgfileCredit}" />
					</td>
				</tr>
				<tr>
					<td class="condition-label">
						<label class="col-form-label">訊息嚴重性:</label>
					</td>
					<td class="condition-input">
						<select id="severity" class="form-control" th:field="*{severity}">
							<option value="" selected="selected">全部</option>
							<option value="Info" th:selected="${severity == msgFileSeverity}">Info</option>
							<option value="Warning" th:selected="${severity == msgFileSeverity}">Warning</option>
							<option value="Error" th:selected="${severity == msgFileSeverity}">Error</option>
							<option value="Fatal" th:selected="${severity == msgFileSeverity}">Fatal</option>
						</select>
					</td>
					<td></td>
					<td class="condition-label">
						<label class="col-form-label">訊息簡述:</label>
					</td>
					<td class="condition-input">
						<input id="msgfileShortmsg" style="width:150px" type="text" class="form-control" th:field="*{msgfileShortmsg}" />
					</td>
				</tr>
			</table>
        </form>			
	</div>
	<div layout:fragment="panel-button">
		<button style="width:100px" type="button" class="btn btn-primary" id="btnQuery">查詢</button>
		<button style="width:100px" type="button" class="btn btn-primary" id="btnClear">清除</button>
	</div>
	<div layout:fragment="panel-summary" class="panel-hidden"></div>
	<div layout:fragment="panel-grid" th:if="${pageData != null}">
        	<div class="card-body table-responsive p-0">	
        		<table class="table table-striped table-bordered table-head-fixed table-hover text-nowrap">
					<thead>
						<tr>
							<th><b>來源通道</b></th>
							<th><b>訊息代碼</b></th>
							<th><b>財金訊息代碼</b></th>
							<th><b>ATM訊息代碼</b></th>
							<th><b>CBS主機訊息代碼</b></th>
							<th><b>信用卡訊息代號</b></th>
							<th><b>子系統</b></th>
							<th><b>訊息嚴重性</b></th>
							<th><b>送事件監控</b></th>							
							<th><b>訊息內容</b></th>
						</tr>   
					</thead>   
                    <tbody th:if="${pageData.list != null}" th:object="${pageData.list}"> 
                    	<tr th:each="data, dataStat : ${pageData.list}">
                    		<td align="center">
                    			<!--來源通道-->
                  				<a class="msgfileChannel" href="#" th:text="${data.msgfileChannelTxt}" th:value="${										
                    			         '{' 											
                    			            + '&quot;msgfileChannelTxt&quot;:&quot;'+(data.msgfileChannelTxt == null ? '':data.msgfileChannelTxt) + '&quot;' + ','
											+ '&quot;msgfileErrorcode&quot;:&quot;'+(data.msgfileErrorcode == null ? '':data.msgfileErrorcode) + '&quot;' + ','
											+ '&quot;msgfileSubsysTxt&quot;:&quot;'+(data.msgfileSubsysTxt == null ? '':data.msgfileSubsysTxt) + '&quot;' + ',' 
											+ '&quot;msgfileSeverity&quot;:&quot;'+(data.msgfileSeverity == null ? '':data.msgfileSeverity) + '&quot;' + ',' 
											+ '&quot;msgfileSendEms&quot;:&quot;'+(data.msgfileSendEms == null ? '':data.msgfileSendEms) + '&quot;' + ',' 
											+ '&quot;msgfileRetain&quot;:&quot;'+(data.msgfileRetain == null ? '':data.msgfileRetain) + '&quot;' + ','
											+ '&quot;msgfileAuth&quot;:&quot;'+(data.msgfileAuth == null ? '':data.msgfileAuth) + '&quot;' + ',' 
											+ '&quot;msgfileWarning&quot;:&quot;'+(data.msgfileWarning == null ? '':data.msgfileWarning) + '&quot;' + ',' 
											+ '&quot;msgfileExternal&quot;:&quot;'+(data.msgfileExternal == null ? '':data.msgfileExternal) + '&quot;' + ',' 
											+ '&quot;msgfileFisc&quot;:&quot;'+(data.msgfileFisc == null ? '':data.msgfileFisc) + '&quot;' + ',' 
											+ '&quot;msgfileAtm&quot;:&quot;'+(data.msgfileAtm == null ? '':data.msgfileAtm) + '&quot;' + ',' 
											+ '&quot;msgfileUatmp&quot;:&quot;'+(data.msgfileUatmp == null ? '':data.msgfileUatmp) + '&quot;' + ',' 
											+ '&quot;msgfileT24&quot;:&quot;'+(data.msgfileT24 == null ? '':data.msgfileT24) + '&quot;' + ','
											+ '&quot;msgfileCredit&quot;:&quot;'+(data.msgfileCredit == null ? '':data.msgfileCredit) + '&quot;' + ',' 
											+ '&quot;msgfileShortmsg&quot;:&quot;'+(data.msgfileShortmsg == null ? '':data.msgfileShortmsg) + '&quot;' + ',' 
											+ '&quot;msgfileMsgdscpt&quot;:&quot;'+(data.msgfileMsgdscpt == null ? '':data.msgfileMsgdscpt) + '&quot;' + ',' 
											+ '&quot;msgfileAction&quot;:&quot;'+(data.msgfileAction == null ? '':data.msgfileAction) + '&quot;' + ',' 
											+ '&quot;msgfileResponsible&quot;:&quot;'+(data.msgfileResponsible == null ? '':data.msgfileResponsible) + '&quot;' + ','
											+ '&quot;msgfileNotify&quot;:&quot;'+(data.msgfileNotify == null ? '':data.msgfileNotify) + '&quot;' + ',' 
											+ '&quot;msgfileVisible&quot;:&quot;'+(data.msgfileVisible == null ? '':data.msgfileVisible) + '&quot;' + ',' 
											+ '&quot;msgfileUicolor&quot;:&quot;'+(data.msgfileUicolor == null ? '':data.msgfileUicolor) + '&quot;' + ','
											+ '&quot;msgfileUicolor&quot;:&quot;'+(data.msgfileFepname == null ? '':data.msgfileFepname) + '&quot;'
										+ '}'
										}">
								</a>                      		
                    		</td>
                    		<td align="center" th:text="${data.msgfileErrorcode}" /><!--訊息代碼-->
                    		<td align="center" th:text="${data.msgfileFisc}" /><!--財金訊息代碼-->
                    		<td align="center" th:text="${data.msgfileAtm}" /><!--ATM訊息代碼-->
                    		<td align="center" th:text="${data.msgfileT24}" /><!--T24訊息代碼-->
                    		<td align="center"  th:text="${data.msgfileCredit}" /><!--信用卡訊息代號-->
                    		<td align="center" th:text="${data.msgfileSubsysTxt}" /><!--子系統-->
                    		<td align="center" th:text="${data.msgfileSeverity}" /><!--訊息嚴重性-->
                    		<td align="center" th:text="${data.msgfileSendEmsTxt}"/><!--送事件監控-->
                            <td align="left"  th:text="${data.msgfileMsgdscpt}" /><!--訊息內容-->     			
                    	</tr>
                    </tbody>		
        		</table>   
        	</div>	
	</div>
	<div layout:fragment="panel-script">
		<script type="text/javascript" th:src="@{/js/atmmon/UI060630.js}"></script>
	</div>
</body>

</html>
