server.port=8201

spring.fep.application.name=fep-service

management.endpoints.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.fep.application.name}-appmon
management.endpoint.health.show-details=always
management.health.jms.enabled=false

#\u8A3B\u518Abean\u555F\u52D5job
spring.register.bean[0]=com.syscom.fep.service.monitor.MonitorLauncher

#Disable Customize Mybatis Interceptor
spring.fep.mybatis.interceptor.audittrail.enable=false
spring.fep.mybatis.interceptor.logger.enable=false

#Disable Quartz Job ReloadDbCacheJob
spring.fep.scheduler.job.com.syscom.fep.scheduler.job.impl.ReloadDbCacheJob=false

#\u4F7F\u7528\u81EA\u5B9A\u7FA9\u7684DataSourceHealthIndicator
spring.fep.service.monitor.actuator.health.db.enable=true

#MonitorScheduler\u6BCF\u4E00\u5206\u9418\u57F7\u884C\u4E00\u6B21
spring.fep.service.monitor.cronExpression=0/30 * * * * ?
spring.fep.service.monitor.recordHttpLog=true

#Mail Alert
spring.fep.service.monitor.mailSender=fep2022@qq.com
spring.fep.service.monitor.mailList=richard_yu@email.lingan.com.cn

# enable mail
spring.fep.mail.enable=true

# enable mitake sms
spring.fep.sms.mitake.enable=true

#ProcessName List
spring.fep.service.monitor.processNameList=suipsrv,suipsrv1

#System Monitor
spring.fep.service.monitor.system.hostname=${spring.fep.hostname}
spring.fep.service.monitor.system.hostip=${spring.fep.hostip}
spring.fep.service.monitor.system.port=${server.port}
spring.fep.service.monitor.system.threshold.notification=true
spring.fep.service.monitor.system.threshold.cpuThreshold=1
spring.fep.service.monitor.system.threshold.ramThreshold=100
spring.fep.service.monitor.system.file.includeMountList=/fep,/fep/logs,/fep/waslogs
spring.fep.service.monitor.system.file.includeMountInterval=60000

