server.port=8206

spring.fep.application.name=fep-server

management.endpoints.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.fep.application.name}-vo
management.endpoint.health.show-details=always

#log
spring.fep.log.total.size.cap=100GB

spring.register.bean[0]=com.syscom.fep.server.queue.VOServerReceiver